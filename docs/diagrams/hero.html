<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .hero{position:absolute;inset:0;padding:56px 64px;display:flex;align-items:center}
  .left{width:610px;position:relative;z-index:2}
  .h1{font-size:68px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:20px 0 22px}
  .h1 .grad{background:linear-gradient(92deg,#8FBBFF 0%,#4F8CFF 45%,#38D9C4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{font-size:20px;line-height:1.8;color:#A9B8CE;margin:0;max-width:560px}
  .lede b{color:#E6EDF7;font-weight:600}
  .stats{display:flex;align-items:stretch;margin-top:36px}
  .stat{padding:0 26px;border-left:1px solid rgba(148,163,184,.18)}
  .stat:first-child{padding-left:0;border-left:0}
  .stat .n{font-family:"Segoe UI",sans-serif;font-size:30px;font-weight:700;color:#E6EDF7;line-height:1}
  .stat .l{font-size:12px;color:#7D90AB;margin-top:8px;letter-spacing:.08em}
  .right{position:relative;width:480px;height:480px;margin-left:auto;margin-top:12px;flex:0 0 auto}
  .right svg{position:absolute;inset:0}
  .node{position:absolute;width:122px;padding:9px 11px;border-radius:12px;background:rgba(13,23,41,.94);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.28);transform:translate(-50%,-50%)}
  .node .idx{font-family:"Segoe UI",sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--c);display:flex;align-items:center;gap:6px}
  .node .idx:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .node .nm{font-size:15px;font-weight:700;margin-top:3px}
  .node .ds{font-size:11px;color:#8EA2BD;margin-top:2px}
  .core{position:absolute;left:240px;top:240px;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(79,140,255,.35),rgba(11,18,32,.96) 68%);border:1px solid rgba(110,168,255,.45);box-shadow:0 0 60px rgba(79,140,255,.18),inset 0 0 30px rgba(79,140,255,.12)}
  .core .a{font-family:"Segoe UI",sans-serif;font-size:10px;letter-spacing:.22em;color:#7FB2FF}
  .core .b{font-size:21px;font-weight:700;margin-top:5px}
  .core .c{font-size:10.5px;color:#8EA2BD;margin-top:4px}
  .note{position:absolute;right:64px;bottom:26px;font-size:11.5px;color:#5F7390;letter-spacing:.04em}
  .note b{color:#8FA6C4;font-weight:600}
</style>
</head>
<body>
<div class="page" style="height:620px">
  <div class="grid"></div>
  <div class="hero">
    <div class="left">
      <div class="kicker"><span class="dot"></span>PRODUCT DESIGN OS · V1.0</div>
      <h1 class="h1">产品设计<br><span class="grad">操作系统</span></h1>
      <p class="lede">把模糊的产品想法，推进到<b>可理解、可行动、<br>可重复、可交易、可验证</b>的方案。<br>不是五本书的读书笔记，而是一套<b>先判断、再设计、<br>最后验证</b>的工作流。</p>
      <div class="stats">
        <div class="stat"><div class="n">5</div><div class="l">本 书</div></div>
        <div class="stat"><div class="n">8</div><div class="l">个 阶 段</div></div>
        <div class="stat"><div class="n">7</div><div class="l">份 文 件</div></div>
        <div class="stat"><div class="n">0</div><div class="l">依 赖</div></div>
      </div>
    </div>

    <div class="right">
      <svg viewBox="0 0 480 480" width="480" height="480" fill="none">
        <circle cx="240" cy="240" r="196" stroke="rgba(148,163,184,.12)" stroke-width="1"/>
        <circle cx="240" cy="240" r="150" stroke="rgba(148,163,184,.15)" stroke-width="1" stroke-dasharray="3 7"/>
        <path d="M240 80 L392.2 190 L334 361.5 L146 361.5 L87.8 190 Z" stroke="rgba(148,163,184,.18)" stroke-width="1" stroke-dasharray="5 7"/>
        <g stroke="rgba(148,163,184,.28)" stroke-width="1" stroke-dasharray="4 6">
          <line x1="240" y1="240" x2="240" y2="80"/>
          <line x1="240" y1="240" x2="392.2" y2="190"/>
          <line x1="240" y1="240" x2="334" y2="361.5"/>
          <line x1="240" y1="240" x2="146" y2="361.5"/>
          <line x1="240" y1="240" x2="87.8" y2="190"/>
        </g>
      </svg>

      <div class="node" style="left:240px;top:80px;--c:#6EA8FF"><div class="idx">01</div><div class="nm">俞军</div><div class="ds">价值与交易</div></div>
      <div class="node" style="left:392px;top:190px;--c:#3DE0C8"><div class="idx">02</div><div class="nm">诺曼</div><div class="ds">认知与行动</div></div>
      <div class="node" style="left:334px;top:362px;--c:#F5B65C"><div class="idx">03</div><div class="nm">原研哉</div><div class="ds">感知与留白</div></div>
      <div class="node" style="left:146px;top:362px;--c:#FF7E9D"><div class="idx">04</div><div class="nm">埃亚尔</div><div class="ds">习惯与投入</div></div>
      <div class="node" style="left:88px;top:190px;--c:#B49CFF"><div class="idx">05</div><div class="nm">杨堃</div><div class="ds">场景与系统</div></div>

      <div class="core"><div class="a">5 LENSES</div><div class="b">产品设计</div><div class="c">一套判断系统</div></div>
    </div>
  </div>
  <div class="note">五本书 · <b>五个有条件的问题</b> · 不是五个并列的真理</div>
</div>
</body>
</html>
